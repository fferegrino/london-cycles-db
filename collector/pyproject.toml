[project]
name = "london-cycles-db"
version = "0.1.0"
description = "Collects the London cycle hire dataset and publishes it to the Hugging Face Hub"
requires-python = ">=3.12"
dependencies = [
    "mind-the-gap==2.1.1",
    "huggingface-hub>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/london_cycles_db"]
