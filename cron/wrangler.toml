name = "london-cycles-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Nothing should reach this Worker over HTTP, so do not publish a
# *.workers.dev URL for it. The cron trigger is unaffected.
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]

# Persist console output to Workers Logs, queryable from the dashboard. At 96
# invocations a day this is nowhere near the free plan's 200k events; logs are
# kept 3 days on free, 7 on paid.
[observability]
enabled = true
head_sampling_rate = 1

# The PAT lives in the account Secrets Store, not in this repo. Find the store
# id with: wrangler secrets-store store list --remote
[[secrets_store_secrets]]
binding = "GH_PAT"
store_id = "b542b969de4a42309165a1f8930ed836"
secret_name = "GH_PAT_LONDON_CYCLES_DB"
