[project]
name = "london-cycles"
version = "0.1.0"
description = "Load the London cycles dataset from the Hugging Face Hub"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/london_cycles"]

# Hatchling's default sdist is the git tree, which would ship the collector,
# the Cloudflare Worker, viz fonts/shapefiles, and stations.csv. Those are
# not the reader package; keep the tarball to what `pip install` needs.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/london_cycles",
    "tests",
]

[tool.uv.workspace]
members = ["collector"]

[tool.uv.sources]
london-cycles-db = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Lets `uv run` reach the collector from the repo root; CI's --no-dev skips it.
    "london-cycles-db",
]
viz = [
    "astral>=3.2",
    "colour>=0.1.5",
    "geopandas>=1.0.0",
    "huggingface-hub>=1.28.0",
    "imagekitio>=5.9.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pytz",
    "seaborn>=0.13.0",
    "typer>=0.27.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    # typer declares CLI options as call-valued defaults; that is the idiom.
    "B008",
    # Timestamps here are UTC by construction or plain calendar dates.
    "DTZ",
]

[tool.ruff.lint.per-file-ignores]
"viz/*" = ["BLE001", "C408", "RUF007"]

[tool.ruff.lint.isort]
known-first-party = ["london_cycles", "london_cycles_db"]
# Fixtures shared by the suite, imported by the test modules next to it.
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
