name: Query TfL and publish snapshot

on:
  schedule:
  # Hourly, not */15. GitHub delivers `schedule` events on a best-effort queue
  # and silently drops delayed ones, so asking for 96 triggers a day yielded
  # about 26. Asking for one an hour is far more likely to be honoured, and the
  # job below takes four snapshots itself -- so the 15-minute resolution no
  # longer depends on the scheduler at all.
  - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Number of snapshots to take (default 4, one every 15 minutes)"
        required: false
        default: "4"

concurrency:
  group: query
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    name: Publish snapshots
    runs-on: ubuntu-latest
    # Four snapshots spaced 15 minutes apart is ~45 minutes; this only bounds a
    # hung run so it cannot block the next hour's trigger indefinitely.
    timeout-minutes: 70

    steps:
    # Fetch only what the job needs. This is what took the run from ~17 minutes
    # (16m38s of it checking out the old data/ tree) down to seconds.
    - uses: actions/checkout@v4
      with:
        filter: blob:none
        sparse-checkout: |
          *.py
          stations.csv
          requirements-query.txt
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-query.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-query.txt

    - name: Query and publish
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        SNAPSHOTS: ${{ github.event.inputs.snapshots || '4' }}
      run: |
        interval=900
        failures=0

        for i in $(seq 1 "$SNAPSHOTS"); do
          if python dataset.py; then
            echo "snapshot $i/$SNAPSHOTS published"
          else
            failures=$((failures + 1))
            # A single TfL or Hub hiccup must not cost the whole batch.
            echo "::warning::snapshot $i/$SNAPSHOTS failed"
          fi

          if [ "$i" -lt "$SNAPSHOTS" ]; then
            sleep "$interval"
          fi
        done

        if [ "$failures" -eq "$SNAPSHOTS" ]; then
          echo "::error::all $SNAPSHOTS snapshots failed"
          exit 1
        fi

        echo "$((SNAPSHOTS - failures))/$SNAPSHOTS snapshots published"

    # The snapshots went to the Hub. Only stations.csv lives in git, and it
    # changes a handful of times a year, so this is usually a no-op. It runs
    # once after the batch rather than after each snapshot.
    - name: Commit stations.csv if it changed
      if: always()
      run: |
        git config --global user.email "antonio.feregrino+datasets@gmail.com"
        git config --global user.name "Antonio Feregrino"

        git add stations.csv
        if git diff --staged --quiet; then
          echo "stations.csv unchanged."
          exit 0
        fi

        git commit -m "Station attributes changed: $(date +'%Y-%m-%d %H:%M')"

        for attempt in 1 2 3 4 5; do
          if git pull --rebase --autostash && git push; then
            echo "Pushed on attempt $attempt."
            exit 0
          fi
          echo "Push attempt $attempt failed; retrying in $((attempt * 5))s."
          sleep $((attempt * 5))
        done

        echo "::error::Failed to push after 5 attempts."
        exit 1
