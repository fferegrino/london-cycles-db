name: Query TfL and publish snapshot

on:
  # Backstop only. GitHub delivers `schedule` events on a best-effort queue and
  # silently drops delayed ones; hourly fared no better than */15 (nine expected
  # triggers, one delivered, twenty minutes late). The normal path is now a
  # Cloudflare Worker cron that dispatches this workflow every 15 minutes -- see
  # cron/. This entry stays so a dead external scheduler degrades coverage to
  # hourly batches instead of stopping it, hence four snapshots here.
  schedule:
  - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Number of snapshots to take, one every 15 minutes"
        required: false
        default: "1"

concurrency:
  group: query
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    name: Publish snapshots
    runs-on: ubuntu-latest
    # Four snapshots spaced 15 minutes apart is ~45 minutes; this only bounds a
    # hung run so it cannot block the next hour's trigger indefinitely.
    timeout-minutes: 70

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Query and publish
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        # Dispatched runs pass their own value (1 by default); the fallback is
        # what the schedule backstop gets, since it supplies no inputs.
        SNAPSHOTS: ${{ github.event.inputs.snapshots || '4' }}
        HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      run: |
        interval=900
        failures=0

        for i in $(seq 1 "$SNAPSHOTS"); do
          if uv run --frozen --no-dev -m london_cycles_db.dataset; then
            echo "snapshot $i/$SNAPSHOTS published"
            # Ping per snapshot, not just per run: a four-snapshot backstop run
            # takes 45 minutes, which on its own would look like silence to a
            # 40-minute check while it is still working perfectly well.
            if [ -n "$HEALTHCHECK_URL" ]; then
              curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL" \
                || echo "::warning::Failed to ping healthchecks.io."
            fi
          else
            failures=$((failures + 1))
            # A single TfL or Hub hiccup must not cost the whole batch.
            echo "::warning::snapshot $i/$SNAPSHOTS failed"
          fi

          if [ "$i" -lt "$SNAPSHOTS" ]; then
            sleep "$interval"
          fi
        done

        if [ "$failures" -eq "$SNAPSHOTS" ]; then
          echo "::error::all $SNAPSHOTS snapshots failed"
          exit 1
        fi

        echo "$((SNAPSHOTS - failures))/$SNAPSHOTS snapshots published"

    # The snapshots went to the Hub. Only stations.csv lives in git, and it
    # changes a handful of times a year, so this is usually a no-op. It runs
    # once after the batch rather than after each snapshot.
    - name: Commit stations.csv if it changed
      if: always()
      run: |
        git config --global user.email "antonio.feregrino+datasets@gmail.com"
        git config --global user.name "Antonio Feregrino"

        git add stations.csv
        if git diff --staged --quiet; then
          echo "stations.csv unchanged."
          exit 0
        fi

        git commit -m "Station attributes changed: $(date +'%Y-%m-%d %H:%M')"

        for attempt in 1 2 3 4 5; do
          if git pull --rebase --autostash && git push; then
            echo "Pushed on attempt $attempt."
            exit 0
          fi
          echo "Push attempt $attempt failed; retrying in $((attempt * 5))s."
          sleep $((attempt * 5))
        done

        echo "::error::Failed to push after 5 attempts."
        exit 1

    # The other half of the dead man's switch. Successful snapshots ping as they
    # happen, above; this reports a broken run straight away instead of making
    # the check wait out its grace period. The ping never fails the job -- a
    # missed ping alerts by itself, and losing snapshots to a monitoring hiccup
    # would be perverse.
    - name: Report failure to dead man's switch
      if: failure()
      env:
        HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      run: |
        if [ -z "$HEALTHCHECK_URL" ]; then
          echo "::warning::HEALTHCHECK_URL is not set; skipping ping."
          exit 0
        fi

        curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail" \
          || echo "::warning::Failed to ping healthchecks.io."
