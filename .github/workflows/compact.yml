name: Compact yesterday's snapshots

on:
  schedule:
  - cron: "30 1 * * *"   # after the day is definitely finished in UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Space-separated YYYY-MM-DD dates (default: yesterday)"
        required: false
        default: ""

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    name: Compact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Compact
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      run: uv run --frozen --no-dev compact.py ${{ github.event.inputs.days }}
