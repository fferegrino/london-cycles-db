name: Compact yesterday's snapshots

on:
  schedule:
  - cron: "30 1 * * *"   # after the day is definitely finished in UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Space-separated YYYY-MM-DD dates (default: yesterday)"
        required: false
        default: ""
      coverage_months:
        description: "Months of history in the coverage graph"
        required: false
        default: "3"

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    name: Compact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Compact
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        DAYS: ${{ github.event.inputs.days }}
      # Unquoted on purpose: DAYS is a space-separated list of dates.
      run: uv run --frozen --no-dev --package london-cycles-db -m london_cycles_db.compact $DAYS

    - name: Refresh coverage graph
      id: coverage
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        COVERAGE_MONTHS: ${{ github.event.inputs.coverage_months || '3' }}
      run: uv run --frozen --no-dev -m london_cycles.coverage --months "$COVERAGE_MONTHS" --output viz/coverage.svg

    - name: Render animation and upload to ImageKit
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      run: |
        uv run --frozen --group viz viz/animate.py \
          --format gif \
          --days 3 \
          --interval 1h \
          --fps 10 \
          --output animation.gif \
          --upload-imagekit \
          --imagekit-folder projects/london-cycles-db \
          --imagekit-file-name latest.gif

    # The README embeds this from ImageKit. Uploaded even if the animation
    # failed, since yesterday's square depends on the compact this job just ran.
    - name: Upload coverage graph to ImageKit
      if: always() && steps.coverage.outcome == 'success'
      env:
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      run: uv run --frozen --group viz viz/upload_imagekit.py viz/coverage.svg --folder projects/london-cycles-db
