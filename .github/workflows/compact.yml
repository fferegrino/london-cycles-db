name: Compact yesterday's snapshots

on:
  schedule:
  - cron: "30 1 * * *"   # after the day is definitely finished in UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Space-separated YYYY-MM-DD dates (default: yesterday)"
        required: false
        default: ""
      coverage_months:
        description: "Months of history in the coverage graph"
        required: false
        default: "3"

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    name: Compact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Compact
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        DAYS: ${{ github.event.inputs.days }}
      # Unquoted on purpose: DAYS is a space-separated list of dates.
      run: uv run --frozen --no-dev --package london-cycles-db -m london_cycles_db.compact $DAYS

    - name: Refresh coverage graph
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        COVERAGE_MONTHS: ${{ github.event.inputs.coverage_months || '3' }}
      run: uv run --frozen --no-dev -m london_cycles.coverage --months "$COVERAGE_MONTHS" --output viz/coverage.svg

    # The README embeds this from R2 rather than from the repo. The object is
    # stored with a one-hour Cache-Control, which GitHub's image proxy honors.
    - name: Upload coverage graph to R2
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: uv run --frozen --group viz viz/upload_r2.py viz/coverage.svg
