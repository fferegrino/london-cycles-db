name: Compact yesterday's snapshots

on:
  schedule:
  - cron: "30 1 * * *"   # after the day is definitely finished in UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Space-separated YYYY-MM-DD dates (default: yesterday)"
        required: false
        default: ""

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    name: Compact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        filter: blob:none
        sparse-checkout: |
          *.py
          requirements-query.txt
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-query.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-query.txt

    - name: Compact
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      run: python compact.py ${{ github.event.inputs.days }}
