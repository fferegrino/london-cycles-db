name: Compact yesterday's snapshots

on:
  schedule:
  - cron: "30 1 * * *"   # after the day is definitely finished in UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Space-separated YYYY-MM-DD dates (default: yesterday)"
        required: false
        default: ""

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    name: Compact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Compact
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      run: uv run --frozen --no-dev --package london-cycles-db -m london_cycles_db.compact ${{ github.event.inputs.days }}

    - name: Render animation and upload to ImageKit
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      run: |
        uv run --frozen --group viz viz/animate.py \
          --format gif \
          --days 3 \
          --interval 1h \
          --fps 10 \
          --output animation.gif \
          --upload-imagekit \
          --imagekit-folder projects/london-cycles-db \
          --imagekit-file-name latest.gif

    # Camo keeps its own copy of README images, so the ImageKit purge alone
    # would not reach GitHub viewers. Purge Camo, then fetch through it once so
    # no visitor pays for the cold fetch.
    - name: Refresh GitHub's Camo cache
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        urls=$(gh api "repos/${{ github.repository }}/readme" -H "Accept: application/vnd.github.html" \
          | grep -oE 'https://camo\.githubusercontent\.com/[^"]+' | sort -u)
        if [ -z "$urls" ]; then
          echo "No Camo URLs found in the rendered README"
          exit 0
        fi
        for url in $urls; do
          curl -sS -X PURGE "$url"; echo
          curl -sS -o /dev/null -w "warmed $url: %{http_code} %{size_download} bytes %{time_total}s\n" "$url"
        done
